<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="
default-src 'self';
script-src 'self';
style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
img-src 'self' https://images.weserv.nl data:;
connect-src https://rss.app;
font-src 'self' https://fonts.gstatic.com;
object-src 'none';
frame-src 'none';
base-uri 'self';
">


    <title>Feed de Instagram</title>
    <link href="https://fonts.googleapis.com/css2?family=Lobster&display=swap" rel="stylesheet" />
    <style>
        @font-face {
            font-family: 'BlissLight';
            src: url('font/BlissLight Regular.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: "BlissLight", sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .feed-container {
            display: flex;
            flex-direction: row;
            align-items: flex-start;
            /* 👈 antes estaba center */
            justify-content: space-between;
            border-radius: 1vw;
            width: 100%;
            height: 100%;
            padding: 3%;
            gap: 3%;
            transition: all 0.5s ease-in-out;
        }

        .feed-text {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            /* 👈 mantiene todo pegado arriba */
            justify-content: flex-start;
            /* 👈 título y logo siempre arriba */
            height: 100%;
            margin-top: 4%;
        }

        .feed-text p {
            color: #180a3a;
            font-size: clamp(12px, 1.5vw, 22px);
            font-weight: bold;
            margin: 0 0 0.4vw 0;
        }

        .img-ig {
            width: 35%;
            max-width: 180px;
            height: auto;
            margin-bottom: 1vw;
        }

        .caption {
            border-radius: 0.6vw;
            padding: 0.8vw;
            font-size: clamp(14px, 1.5vw, 22px);
            color: #333;
            overflow: hidden;
            flex-grow: 1;
            /* 👈 se expande solo este bloque */
            display: flex;
            align-items: flex-start;
            margin-top: 2%;
        }

        .feed-image {
            flex: 0.9;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            /* 👈 alinea imagen al mismo nivel del título */
            padding: 2%;
        }

        .feed-image img {
            width: 100%;
            height: auto;
            max-height: 77vh;
            border-radius: 1vw;
            object-fit: cover;
        }

        .fade {
            opacity: 0;
            transition: opacity 1s ease-in-out;
        }

        .visible {
            opacity: 1;
        }

        @media (max-aspect-ratio: 1/1) {

            /* 📱 Para pantallas verticales */
            .feed-container {
                flex-direction: column;
                align-items: center;
                text-align: center;
            }

            .feed-text {
                align-items: center;
            }

            .img-ig {
                width: 45%;
                max-width: 150px;
            }

            .feed-image {
                align-items: center;
            }

            .feed-image img {
                width: 85%;
                max-width: 350px;
                max-height: 45vh;
            }
        }
    </style>
</head>

<body>
    <div id="feed" class="feed-container visible">
        <div class="feed-text">
            <p>Novedades en:</p>
            <img class="img-ig" src="img/ig_text.png" alt="Instagram" />
            <div class="caption">Cargando publicación...</div>
        </div>
        <div class="feed-image">
            <img src="" alt="Post de Instagram" />
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
